<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CloudApp — AWS Production Architecture</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: linear-gradient(135deg, #0a0e1a 0%, #0d1b2a 50%, #112240 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #e2e8f0;
        }
        .container {
            max-width: 900px;
            width: 90%;
            padding: 40px;
        }
        .header {
            text-align: center;
            margin-bottom: 40px;
        }
        .badge {
            display: inline-block;
            background: rgba(100, 255, 218, 0.1);
            border: 1px solid rgba(100, 255, 218, 0.3);
            color: #64ffda;
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 13px;
            letter-spacing: 1px;
            text-transform: uppercase;
            margin-bottom: 20px;
        }
        h1 {
            font-size: 2.8rem;
            font-weight: 700;
            background: linear-gradient(90deg, #64ffda, #7b2ff7);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 10px;
        }
        .subtitle {
            color: #8892b0;
            font-size: 1.1rem;
        }
        .status-bar {
            display: flex;
            align-items: center;
            gap: 8px;
            justify-content: center;
            margin-top: 16px;
        }
        .dot {
            width: 10px; height: 10px;
            background: #64ffda;
            border-radius: 50%;
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.5; transform: scale(1.3); }
        }
        .status-text { color: #64ffda; font-size: 14px; }
        .arch-section {
            margin-top: 40px;
            background: rgba(255,255,255,0.04);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 16px;
            padding: 28px;
        }
        .arch-title {
            font-size: 1rem;
            color: #64ffda;
            margin-bottom: 20px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .flow {
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
        }
        .flow-item {
            background: rgba(123,47,247,0.15);
            border: 1px solid rgba(123,47,247,0.3);
            border-radius: 8px;
            padding: 8px 16px;
            font-size: 13px;
            color: #c3b1e1;
        }
        .flow-arrow { color: #64ffda; font-size: 18px; }
        .footer {
            text-align: center;
            margin-top: 40px;
            color: #4a5568;
            font-size: 13px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="badge">🚀 Production Ready</div>
            <h1>CloudApp</h1>
            <p class="subtitle">AWS Production Architecture — ap-south-1</p>
            <div class="status-bar">
                <div class="dot"></div>
                <span class="status-text">All Systems Operational</span>
            </div>
        </div>

        <div class="arch-section">
            <div class="arch-title">📐 Architecture Flow</div>
            <div class="flow">
                <div class="flow-item">👤 Users</div>
                <div class="flow-arrow">→</div>
                <div class="flow-item">🔀 ALB</div>
                <div class="flow-arrow">→</div>
                <div class="flow-item">⚖️ Auto Scaling Group</div>
                <div class="flow-arrow">→</div>
                <div class="flow-item">🐳 Docker (EC2 Private)</div>
                <div class="flow-arrow">→</div>
                <div class="flow-item">🟩 Nginx App</div>
            </div>
        </div>

        <div class="footer">
            Deployed via Jenkins CI/CD · Terraform IaC · Containerized with Docker · Monitored by CloudWatch
        </div>
    </div>
</body>
</html>
