name: Terraform Drift Detection

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

jobs:
  drift-check:
    runs-on: ubuntu-latest
    env:
      AWS_REGION: ap-south-1

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Configure AWS Credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ env.AWS_REGION }}

    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v3

    - name: Terraform Init
      working-directory: ./terraform
      run: terraform init -input=false

    - name: Terraform Plan - Drift Check
      working-directory: ./terraform
      id: plan
      continue-on-error: true
      run: terraform plan -input=false -detailed-exitcode

    - name: Report Drift Status
      run: |
        if [ "${{ steps.plan.outcome }}" == "failure" ]; then
          echo "::warning::⚠️ DRIFT DETECTED — Terraform plan found differences between state and live infrastructure."
          exit 1
        else
          echo "✅ No drift detected. Infrastructure matches Terraform state."
        fi
